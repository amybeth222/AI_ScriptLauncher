<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Script Launcher</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div id="app">
        <header>
            <h1>SCRIPT LAUNCHER</h1>
            <div id="folder-row">
                <span id="folder-path">No folder selected</span>
            </div>
        </header>

        <div id="toolbar">
            <input id="search" type="text" placeholder="Filter scripts..." />
            <button id="about-btn" title="About" aria-expanded="false">ⓘ</button>
            <button id="settings-btn" title="Settings" aria-expanded="false">⚙</button>
            <button id="refresh-btn" title="Refresh">⟳</button>
        </div>

        <div id="about-backdrop" hidden></div>
        <section id="about-panel" aria-label="About Script Launcher" hidden>
            <button id="about-close-btn" type="button" title="Close">×</button>
            <div id="about-name">SCRIPT LAUNCHER</div>
            <div id="about-version"></div>
            <p id="about-description">
                Scans a folder of .jsx/.jsxbin scripts and runs any of them with one click.
            </p>
            <div id="about-author">
                Amy Beth &middot; <a id="about-link" href="https://scriptdepository.com">https://scriptdepository.com</a>
            </div>
        </section>

        <section id="settings-panel" aria-label="Display and folder settings" hidden>
            <label>
                Text size
                <input id="text-size" type="number" min="8" max="24" step="1" />
                <span>px</span>
            </label>
            <label>
                Text color
                <input id="text-color" type="color" />
            </label>
            <label>
                UI Color
                <input id="ui-color" type="color" />
            </label>
            <label>
                Row spacing
                <input id="row-spacing" type="number" min="0" max="24" step="1" />
                <span>px</span>
            </label>
            <div id="folder-sources-section">
                <div class="settings-section-label">Folder Sources</div>
                <div id="folder-source-list"></div>
                <button id="add-folder-btn" type="button">+ Add Folder</button>
            </div>
        </section>

        <div id="script-list"></div>

        <footer>
            <span id="status">Ready</span>
        </footer>
    </div>

    <script src="./lib/CSInterface.js"></script>
    <script src="./main.js"></script>
</body>
</html>
